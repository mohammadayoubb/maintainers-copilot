<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Demo Host App</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      main {
        max-width: 900px;
        margin: 80px auto;
        padding: 32px;
        background: white;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      code {
        background: #f3f4f6;
        padding: 3px 6px;
        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Demo Host App</h1>

      <p>
        This is a normal host website. It embeds the Maintainer Copilot widget
        using one script tag.
      </p>

      <p>
        Embed snippet:
        <code>
          &lt;script src="http://localhost:8000/widget.js" data-widget-id="demo-widget"&gt;&lt;/script&gt;
        </code>
      </p>
    </main>

    <script src="http://localhost:8000/widget.js" data-widget-id="demo-widget"></script>
  </body>
</html>

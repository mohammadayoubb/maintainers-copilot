# Alembic configuration file.
#
# Alembic is used for database migrations.
# A migration is a versioned database change, such as:
# - creating the issues table
# - adding a new column
# - creating the users table later
#
# This file tells Alembic where migration scripts live and how logging works.

[alembic]
# Migration scripts will live inside app/db/migrations.
script_location = app/db/migrations

# Add the current project root to Python's import path.
# This allows Alembic to import app.db.models.
prepend_sys_path = .

# Store migration timestamps in UTC.
timezone = UTC

# Database URL.
# For local dev, this points to the Docker Compose Postgres service exposed on localhost.
# Later, the password should come from Vault.
sqlalchemy.url = postgresql+psycopg://maintainer:maintainer@localhost:5432/maintainers_copilot

[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
# Keep SQLAlchemy logs quiet by default.
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
# Alembic migration logs are useful, so keep them at INFO.
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
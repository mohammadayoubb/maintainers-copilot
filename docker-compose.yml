# Docker Compose file for the Week 7 Maintainer's Copilot project.
#
# This file starts the base local development stack:
# - api: main FastAPI backend
# - model-server: ML/NLP inference server
# - chatbot: Streamlit internal/admin app
# - db: Postgres with pgvector
# - redis: short-term memory and cache
# - minio: blob/artifact storage
# - vault: local dev secrets manager

services:
  api:
    # Temporary Python image for the foundation stage.
    # Later, we can replace this with a real Dockerfile.
    image: python:3.11-slim

    # Mount the project into /app inside the container.
    working_dir: /app

    # Install project dependencies from pyproject.toml, then run the API.
    # This is better than manually listing dependencies in the command.
    command: >
      sh -c "pip install -e . &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    ports:
      - "${API_PORT:-8000}:8000"

    volumes:
      - .:/app

    env_file:
      - .env

    # The API depends on these services existing.
    # Later, startup checks will verify they are actually reachable.
    depends_on:
      - db
      - redis
      - minio
      - vault

  model-server:
    # Separate service for ML/NLP inference endpoints.
    image: python:3.11-slim
    working_dir: /app

    # Install project dependencies from pyproject.toml, then run the model server.
    command: >
      sh -c "pip install -e . &&
             uvicorn model_server.main:app --host 0.0.0.0 --port 8001 --reload"

    ports:
      - "${MODEL_SERVER_PORT:-8001}:8001"

    volumes:
      - .:/app

    env_file:
      - .env

  chatbot:
    # Streamlit internal/admin frontend.
    image: python:3.11-slim
    working_dir: /app

    # Install project dependencies from pyproject.toml, then run Streamlit.
    command: >
      sh -c "pip install -e . &&
             streamlit run streamlit_app/app.py --server.port 8501 --server.address 0.0.0.0"

    ports:
      - "${STREAMLIT_PORT:-8501}:8501"

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - api

  db:
    # Postgres image with pgvector installed.
    # pgvector will later support long-term memory and RAG embeddings.
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_USER: maintainer
      POSTGRES_PASSWORD: maintainer
      POSTGRES_DB: maintainers_copilot

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    # Redis is used later for short-term memory and cache.
    image: redis:7

    ports:
      - "${REDIS_PORT:-6379}:6379"

  minio:
    # MinIO is local S3-compatible blob storage.
    # Later, it will store model artifacts, eval reports, plots, and retrieval snapshots.
    image: minio/minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data

  vault:
    # Vault stores secrets in local dev mode.
    # Later, the API will refuse to boot if required Vault secrets are missing.
    image: hashicorp/vault:1.15

    cap_add:
      - IPC_LOCK

    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200

    ports:
      - "${VAULT_PORT:-8200}:8200"

volumes:
  # Persistent Postgres data.
  postgres_data:

  # Persistent MinIO blob data.
  minio_data:
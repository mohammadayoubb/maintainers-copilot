<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintainer Copilot Widget</title>

    <style>
      :root {
        --primary: #111827;
        --primary-soft: #1f2937;
        --border: #e5e7eb;
        --muted: #6b7280;
        --bg: #f9fafb;
        --danger-bg: #fee2e2;
        --danger-border: #fecaca;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: transparent;
      }

      .bubble {
        width: 64px;
        height: 64px;
        border-radius: 999px;
        border: 0;
        background: var(--primary);
        color: white;
        font-size: 26px;
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .widget {
        width: 100%;
        height: 100vh;
        background: #ffffff;
        border-radius: 18px;
        overflow: hidden;
        display: none;
        flex-direction: column;
        border: 1px solid var(--border);
        box-shadow: 0 16px 45px rgba(0, 0, 0, 0.18);
      }

      .widget.open {
        display: flex;
      }

      .bubble.hidden {
        display: none;
      }

      .header {
        padding: 14px 16px;
        background: var(--primary);
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .title-block {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .title {
        font-size: 15px;
        font-weight: 800;
      }

      .subtitle {
        font-size: 11px;
        color: #d1d5db;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .status {
        font-size: 11px;
        font-weight: 500;
        color: #d1d5db;
      }

      .icon-button {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: white;
        border: 0;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
      }

      .auth {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        background: #f9fafb;
      }

      .auth input {
        width: 100%;
        margin-bottom: 8px;
      }

      .messages {
        flex: 1;
        padding: 14px;
        overflow-y: auto;
        background: var(--bg);
      }

      .message {
        padding: 10px 12px;
        margin-bottom: 10px;
        border-radius: 14px;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .assistant {
        background: #ffffff;
        border: 1px solid var(--border);
        color: #111827;
      }

      .user {
        background: #dbeafe;
        color: #111827;
        margin-left: 28px;
      }

      .error {
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        color: #7f1d1d;
      }

      .composer {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--border);
        background: white;
      }

      input {
        flex: 1;
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 12px;
        outline: none;
      }

      input:focus {
        border-color: var(--primary);
      }

      button {
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        cursor: pointer;
        font-weight: 700;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .hint {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
      }

      .quick-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        background: #ffffff;
      }

      .quick-actions button {
        padding: 7px 9px;
        font-size: 11px;
        background: #f3f4f6;
        color: #111827;
        border: 1px solid var(--border);
        font-weight: 600;
      }

      code {
        background: #f3f4f6;
        padding: 1px 4px;
        border-radius: 4px;
      }

      strong {
        font-weight: 800;
      }
    </style>
  </head>

  <body>
    <button class="bubble" id="bubble" type="button" aria-label="Open chat">
      🛠️
    </button>

    <div class="widget" id="widget">
      <div class="header">
        <div class="title-block">
          <span class="title">Maintainer Copilot</span>
          <span class="subtitle">Issue triage assistant</span>
        </div>

        <div class="header-actions">
          <span class="status" id="status">Not logged in</span>
          <button class="icon-button" id="minimize-button" type="button" aria-label="Minimize">
            −
          </button>
        </div>
      </div>

      <div class="auth" id="auth-box">
        <input id="email-input" placeholder="Email" value="authuser@example.com" />
        <input
          id="password-input"
          placeholder="Password"
          type="password"
          value="StrongPassword123!"
        />
        <button id="login-button" type="button">Login</button>
      </div>

      <div class="messages" id="messages">
        <div class="hint" id="widget-id"></div>

        <div class="message assistant">
          Hi, I can help classify issues, extract code entities, summarize threads,
          search RAG context, and write explicit memory.
        </div>
      </div>

      <div class="quick-actions">
        <button type="button" data-prompt="Classify this issue: read_csv fails with ValueError">
          Classify
        </button>
        <button
          type="button"
          data-prompt="Extract entities from this issue: read_csv() fails with ValueError in parser.py"
        >
          Entities
        </button>
        <button
          type="button"
          data-prompt="How should pandas maintainers handle a read_csv parsing bug?"
        >
          RAG
        </button>
      </div>

      <form class="composer" id="chat-form">
        <input id="chat-input" placeholder="Ask about an issue..." />
        <button id="send-button" type="submit">Send</button>
      </form>
    </div>

    <script>
      const API_BASE_URL = "http://localhost:8000";

      const params = new URLSearchParams(window.location.search);
      const widgetId = params.get("widget_id") || "demo-widget";

      let token = null;
      let conversationId = null;

      const bubble = document.getElementById("bubble");
      const widget = document.getElementById("widget");
      const minimizeButton = document.getElementById("minimize-button");
      const messages = document.getElementById("messages");
      const form = document.getElementById("chat-form");
      const input = document.getElementById("chat-input");
      const statusLabel = document.getElementById("status");
      const authBox = document.getElementById("auth-box");
      const emailInput = document.getElementById("email-input");
      const passwordInput = document.getElementById("password-input");
      const loginButton = document.getElementById("login-button");
      const sendButton = document.getElementById("send-button");

      document.getElementById("widget-id").textContent = "Widget ID: " + widgetId;

      function resize(width, height) {
        window.parent.postMessage(
          {
            type: "maintainer-copilot-resize",
            width,
            height,
          },
          "*"
        );
      }

      function openWidget() {
        widget.classList.add("open");
        bubble.classList.add("hidden");
        resize(390, 620);
      }

      function closeWidget() {
        widget.classList.remove("open");
        bubble.classList.remove("hidden");
        resize(74, 74);
      }

      function renderMarkdownLite(text) {
        return text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
          .replace(/`(.*?)`/g, "<code>$1</code>");
      }

      function addMessage(role, content) {
        const div = document.createElement("div");
        div.className = "message " + role;
        div.innerHTML = renderMarkdownLite(content);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      async function login() {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          addMessage("error", "Email and password are required.");
          return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        try {
          const body = new URLSearchParams();
          body.set("username", email);
          body.set("password", password);

          const response = await fetch(API_BASE_URL + "/auth/jwt/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body,
          });

          if (!response.ok) {
            const error = await response.text();
            addMessage("error", "Login failed: " + error);
            return;
          }

          const data = await response.json();
          token = data.access_token;

          statusLabel.textContent = "Logged in";
          authBox.style.display = "none";

          addMessage("assistant", "Login successful. You can now chat with the backend.");
        } catch (error) {
          addMessage("error", "Login request failed: " + error);
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = "Login";
        }
      }

      async function sendMessage(value) {
        if (!token) {
          addMessage("error", "Please login first.");
          return;
        }

        const payload = {
          message: value,
        };

        if (conversationId !== null) {
          payload.conversation_id = conversationId;
        }

        sendButton.disabled = true;

        try {
          const response = await fetch(API_BASE_URL + "/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + token,
            },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            const error = await response.text();
            addMessage("error", "Chat request failed: " + error);
            return;
          }

          const data = await response.json();
          conversationId = data.conversation_id;

          addMessage("assistant", data.response || "No response returned.");
        } catch (error) {
          addMessage("error", "Chat request failed: " + error);
        } finally {
          sendButton.disabled = false;
        }
      }

      bubble.addEventListener("click", openWidget);
      minimizeButton.addEventListener("click", closeWidget);
      loginButton.addEventListener("click", login);

      document.querySelectorAll("[data-prompt]").forEach(function (button) {
        button.addEventListener("click", function () {
          input.value = button.getAttribute("data-prompt");
          input.focus();
        });
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const value = input.value.trim();

        if (!value) {
          return;
        }

        addMessage("user", value);
        input.value = "";

        sendMessage(value);
      });

      closeWidget();
    </script>
  </body>
</html>

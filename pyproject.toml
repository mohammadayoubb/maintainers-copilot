[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainers-copilot"
version = "0.1.0"
description = "Week 7 Maintainer's Copilot project with classification, RAG, chatbot, memory, and widget support."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "fastapi-users[sqlalchemy]>=14.0.0",
    "pwdlib[argon2]>=0.2.0",
]

[project.optional-dependencies]
chatbot = [
    "streamlit>=1.37.0",
]

model = [
    "transformers>=4.44.0",
    "safetensors>=0.4.0",
    "sentence-transformers>=3.0.0",
]

dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
]

[tool.setuptools.packages.find]
include = ["app*", "model_server*", "rag*", "evals*"]
exclude = ["ml*", "demo*", "widget*", "prompts*", "streamlit_app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true